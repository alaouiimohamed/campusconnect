[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = '''
/(\.venv|staticfiles)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".venv", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-ra"
