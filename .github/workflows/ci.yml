name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, black, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: campusconnect
          POSTGRES_USER: campusconnect
          POSTGRES_PASSWORD: campusconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campusconnect -d campusconnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-insecure-secret-key-not-for-production
      DEBUG: "False"
      DATABASE_URL: postgres://campusconnect:campusconnect@localhost:5432/campusconnect

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Vérifier les migrations manquantes
        run: python manage.py makemigrations --check --dry-run

      - name: Pytest
        run: pytest

