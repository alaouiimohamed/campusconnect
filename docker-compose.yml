# Base PostgreSQL 16 + pgvector pour le développement local (option Docker).
# Alternative sans Docker : base Neon (voir README.md).
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: campusconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: campusconnect
      POSTGRES_USER: campusconnect
      POSTGRES_PASSWORD: campusconnect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusconnect -d campusconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
